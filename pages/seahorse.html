<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>juliette's art gallery</title>

  <link href="style.css" rel="stylesheet" type="text/css" />
 <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.js"></script>

  <script>
  let bottomImg, topImg;

  function preload() {
    bottomImg = loadImage('assets/images/paintings/seahorse.jpeg'); 
    topImg = loadImage('assets/images/paintings/seahorse-modified.jpeg'); 
  }

 function setup() {
  createCanvas(500, 375);
  noCursor();
  cursor('assets/images/cursor.cur', 20, -10);

  image(topImg, 0, 0, 500, 375);
}

function mouseDragged() {
  let size = 40;
  let srcX = mouseX * bottomImg.width / width - size/2;
  let srcY = mouseY * bottomImg.height / height - size/2;
  let srcW = size * bottomImg.width / width;
  let srcH = size * bottomImg.height / height;
  copy(bottomImg, srcX, srcY, srcW, srcH, mouseX - size/2, mouseY - size/2, size, size);
}

</script>
</head>
<body>
</body>
</html>
